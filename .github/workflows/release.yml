name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, ubuntu-22.04-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python setup tools
        run: |
          pip install setuptools

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Add macOS certs
        if: runner.os == 'macOS'
        run: chmod +x ./.github/add-macos-certificate.sh && ./.github/add-macos-certificate.sh
        env:
          APPLE_CERTIFICATES: ${{ secrets.APPLE_CERTIFICATES }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}

      - name: Publish x64
        if: ${{ runner.arch == 'X64' || runner.os == 'macOS' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: corepack yarn run publish --arch x64

      - name: Publish arm64
        if: ${{ runner.arch == 'ARM64' || runner.os == 'macOS'}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: corepack yarn run publish --arch arm64
