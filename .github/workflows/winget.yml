name: Publish to WinGet

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.5.0)
        required: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: CVMEventi.Countdown
          installers-regex: '-Windows-x64-.*\.exe$'
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
